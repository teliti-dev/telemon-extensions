[package]
name = "router-health-backend"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# Built against the Telemon SDK; scripts/build.sh points this at a local checkout through a cargo patch.
telemon-ext-guest = { git = "https://github.com/teliti-dev/telemon", branch = "master" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
